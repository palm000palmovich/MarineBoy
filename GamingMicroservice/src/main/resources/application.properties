spring.application.name=GamingMicroservice
server.port=8081

#BD
spring.datasource.url=jdbc:postgresql://localhost:5433/gamingBD
spring.datasource.username=shopogolik
spring.datasource.password=freak
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Migration
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

#AOP
spring.aop.auto=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.verySimpleShit.time-to-lived=450
spring.cache.redis.simpleShit.time-to-lived=3600
spring.cache.redis.compositeShit.time-to-lived=7200

#Kafka
spring.kafka.bootstrap-servers=localhost:9092